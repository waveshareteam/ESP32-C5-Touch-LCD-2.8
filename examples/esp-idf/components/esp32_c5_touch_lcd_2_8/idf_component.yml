dependencies:
  esp_codec_dev:
    public: true
    version: ~1.5
  waveshare/custom_io_expander_ch32v003:
    public: true
    # This BSP uses the 1.x API; see docs/compatibility.md before a major upgrade.
    version: "^1.0.1"
  espressif/esp_lvgl_adapter:
    public: true
    version: 0.4.*
  idf: '>=5.5'
