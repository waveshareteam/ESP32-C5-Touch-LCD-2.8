  lvgl/lvgl: '9.3.0'
  esp_lcd_panel_io_additions: "^1"
  waveshare/qmi8658: 
      # The applications use qmi8658_dev_t and the 1.x function signatures.
      version: "^1.0.1"
  waveshare/pcf85063a: ^1.0.1
  

description: Board Support Package (BSP) for Waveshare ESP32-C5-Touch-LCD-2.8
tags:
- bsp
targets:
- esp32c5
url: https://www.waveshare.com/ESP32-C5-Touch-LCD-2.8.htm
